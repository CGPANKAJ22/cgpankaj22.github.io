<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-9T/6dLLsyfjwlNfaZDOunjv+/5gdzpHect1UsT1YYCM=' 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://images.pexels.com; connect-src 'self' https://ntfy.sh https://docs.google.com; frame-src https://maps.google.com https://www.google.com; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">

<title>PDF | PANKAJ CHOICE CENTER</title>
<style>
  :root { --b: #1e4fd8; --ink: #1f2937; --mut: #6b7280; --line: #e5e7eb; --pen: #1238a8; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; background: #f1f3f6; color: var(--ink); font-size: 14px; }
  button { font: inherit; }
  .pv-bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); }
  .pv-back { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 20px; }
  .pv-back:hover { background: #f3f4f6; }
  .pv-t { flex: 1; min-width: 0; }
  .pv-t b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pv-t small { color: var(--mut); font-size: 12px; }
  .pv-btns { flex: none; display: flex; align-items: center; gap: 8px; }
  .pv-zoom { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .pv-zoom button { width: 32px; height: 34px; border: 0; background: #fff; color: var(--ink); font-size: 17px; cursor: pointer; }
  .pv-zoom button:hover { background: #f3f4f6; }
  .pv-zoom span { min-width: 46px; text-align: center; font-size: 12px; color: var(--mut); border-left: 1px solid var(--line); border-right: 1px solid var(--line); line-height: 34px; }
  .pv-b { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .pv-b:hover { background: #f9fafb; border-color: #d1d5db; }
  .pv-b.pri { background: var(--b); border-color: var(--b); color: #fff; }
  .pv-b.pri:hover { background: #1a45c0; }
  .pv-b.on { background: #eef2ff; border-color: #c7d2fe; color: var(--b); }
  .pv-b[disabled] { opacity: .5; cursor: default; }
  .pv-b svg { width: 16px; height: 16px; flex: none; }
  .pv-b .car { font-size: 10px; opacity: .7; display: none; }
  body.has .pv-b .car { display: inline; }
  .pv-dd { position: relative; }
  .pv-menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 190px; padding: 6px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(17,24,39,.12); display: none; z-index: 30; }
  .pv-dd.open .pv-menu { display: block; }
  .pv-menu a, .pv-menu button { display: block; width: 100%; padding: 9px 10px; border: 0; border-radius: 6px; background: none; color: var(--ink); text-align: left; text-decoration: none; cursor: pointer; }
  .pv-menu a:hover, .pv-menu button:hover { background: #f3f4f6; }
  .pv-menu small { display: block; color: var(--mut); font-size: 12px; }
  /* Form bharne ki patli patti */
  .pv-tools { position: sticky; top: var(--bar-h, 57px); z-index: 19; display: none; align-items: center; gap: 6px; padding: 6px 16px; background: #fff; border-bottom: 1px solid var(--line); }
  body.filling .pv-tools { display: flex; }
  .pv-seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .pv-tb { height: 30px; padding: 0 10px; border: 0; background: #fff; color: var(--ink); cursor: pointer; font-size: 13px; }
  .pv-seg .pv-tb + .pv-tb { border-left: 1px solid var(--line); }
  .pv-tb:hover { background: #f3f4f6; }
  .pv-tb.on { background: #eef2ff; color: var(--b); font-weight: 600; }
  .pv-ink { width: 20px; height: 20px; margin: 0 2px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
  .pv-ink.on { box-shadow: 0 0 0 2px var(--b); }
  .pv-sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  .pv-tools .tip { flex: 1; color: var(--mut); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pv-tools .pv-b { height: 30px; padding: 0 12px; }
  .pv-msg { max-width: 640px; margin: 24px auto; padding: 14px 16px; border-radius: 10px; background: #fff; border: 1px solid var(--line); text-align: center; color: var(--mut); }
  .pv-msg.err { color: #b91c1c; }
  .pv-pages { display: flex; flex-direction: column; align-items: safe center; gap: 16px; padding: 20px 12px 48px; overflow-x: auto; }
  .pv-pg { position: relative; flex: none; width: var(--pw, 900px); max-width: none; container-type: inline-size; background: #fff; box-shadow: 0 1px 3px rgba(17,24,39,.12), 0 4px 14px rgba(17,24,39,.06); }
  .pv-pg canvas { display: block; width: 100%; height: auto; }
  .pv-lay { position: absolute; inset: 0; }
  body.filling .pv-lay { cursor: text; }
  body.filling.tick .pv-lay { cursor: crosshair; }
  /* Pen jaisa likha hua */
  .pv-w { position: absolute; min-width: 1.2em; padding: 0 .12em; outline: none; white-space: pre; line-height: 1.15; color: var(--c, var(--pen)); font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", "Kalam", cursive; font-size: calc(var(--fs, 1.9) * 1cqw); font-weight: 600; letter-spacing: .01em; background: transparent; border-radius: 3px; }
  body.filling .pv-w { box-shadow: 0 0 0 1px rgba(30,79,216,.25); }
  body.filling .pv-w:focus-within { background: rgba(30,79,216,.05); box-shadow: 0 0 0 1px var(--b); }
  .pv-w .x, .pv-w .mv { display: none; position: absolute; top: -1.05em; width: 16px; height: 16px; border-radius: 50%; font: 600 10px/16px system-ui, sans-serif; text-align: center; color: #fff; cursor: pointer; user-select: none; }
  .pv-w .x { right: -8px; background: #6b7280; }
  .pv-w .mv { left: -8px; background: var(--b); cursor: move; }
  body.filling .pv-w:focus-within .x, body.filling .pv-w:focus-within .mv, body.filling .pv-w:hover .x, body.filling .pv-w:hover .mv { display: block; }
  .pv-w [data-t] { outline: none; display: inline-block; min-width: .6em; }
  .pv-n { font-size: 11px; color: var(--mut); margin-top: -10px; }
  @media (max-width: 700px) {
    .pv-bar { flex-wrap: wrap; gap: 8px; padding: 8px 10px; position: static; }
    .pv-t { flex-basis: calc(100% - 50px); }
    .pv-btns { width: 100%; }
    .pv-btns .pv-dd, .pv-btns > .pv-b { flex: 1; }
    .pv-btns .pv-b { width: 100%; justify-content: center; padding: 0 8px; }
    .pv-zoom { display: none; }
    .pv-tools { top: 0; flex-wrap: wrap; padding: 6px 8px; }
    .pv-tools .tip { flex-basis: 100%; order: 9; }
    .pv-sep { display: none; }
    #pv-done { margin-left: auto; }
    .pv-pages { padding: 10px 4px 30px; gap: 10px; }
  }
  @media print {
    /* Printer kaagaz ke kinare par nahi chhaapta: 8 mm surakshit margin, aur har page kaagaz me poora fit (upar-neeche kuch na kate) */
    @page { margin: 8mm; }
    html, body { margin: 0; padding: 0; background: #fff; }
    .pv-bar, .pv-tools, .pv-msg, .pv-n, .pv-w .x, .pv-w .mv { display: none !important; }
    .pv-pages { padding: 0; gap: 0; display: block; overflow: visible; }
    .pv-pg { max-width: 100%; width: min(100%, calc((100vh - 1mm) * var(--ar, .707))) !important; margin: 0 auto; box-shadow: none; break-inside: avoid; page-break-inside: avoid; break-after: page; page-break-after: always; }
    .pv-pg:last-of-type { break-after: auto; page-break-after: auto; }
    .pv-w { background: transparent !important; box-shadow: none !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.blankprint .pv-w { display: none !important; }
  }
</style>
</head>
<body>
<div class="pv-bar" id="pv-bar">
  <a class="pv-back" href="aadhaar.html" aria-label="Aadhaar Docs par wapas" title="Wapas">←</a>
  <div class="pv-t"><b id="pv-title">PDF</b><small id="pv-sub">PANKAJ CHOICE CENTER</small></div>
  <div class="pv-btns">
    <div class="pv-zoom"><button type="button" id="pv-zo" aria-label="Chhota karein">−</button><span id="pv-zv">100%</span><button type="button" id="pv-zi" aria-label="Bada karein">+</button></div>
    <button type="button" class="pv-b" id="pv-fill" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Form bharein</button>
    <div class="pv-dd" id="pv-dd-dl">
      <button type="button" class="pv-b" id="pv-dlb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Download<span class="car">▾</span></button>
      <div class="pv-menu"><button type="button" id="pv-dlf">Bhara hua form<small>Aapka likha hua saath me</small></button><a id="pv-dl" href="#" download>Khali form<small>Original PDF</small></a></div>
    </div>
    <div class="pv-dd" id="pv-dd-pr">
      <button type="button" class="pv-b pri" id="pv-pr" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg>Print<span class="car">▾</span></button>
      <div class="pv-menu"><button type="button" id="pv-prf">Bhara hua form</button><button type="button" id="pv-prb">Khali form</button></div>
    </div>
  </div>
</div>
<div class="pv-tools" id="pv-tools">
  <div class="pv-seg"><button type="button" class="pv-tb on" id="pv-mtext">Likhein</button><button type="button" class="pv-tb" id="pv-mtick">✓ Tick</button></div>
  <div class="pv-seg"><button type="button" class="pv-tb" id="pv-fsm" aria-label="Akshar chhote">A−</button><button type="button" class="pv-tb" id="pv-fsp" aria-label="Akshar bade">A+</button></div>
  <button type="button" class="pv-ink on" id="pv-blue" style="background:#1238a8" aria-label="Neeli syahi" title="Neeli syahi"></button><button type="button" class="pv-ink" id="pv-black" style="background:#111" aria-label="Kaali syahi" title="Kaali syahi"></button>
  <span class="pv-sep"></span>
  <button type="button" class="pv-tb" id="pv-clear">Sab mitayein</button>
  <span class="tip" id="pv-tip">Form par jahan likhna hai wahan click karke type kijiye</span>
  <button type="button" class="pv-b pri" id="pv-done">Ho gaya</button>
</div>
<div class="pv-msg" id="pv-msg">PDF khul rahi hai…</div>
<div class="pv-pages" id="pv-pages"></div>
<script>(function(){
  var P=new URLSearchParams(location.hash.slice(1)), f=P.get('f')||'', t=(P.get('t')||'').slice(0,140);
  var msg=document.getElementById('pv-msg'), box=document.getElementById('pv-pages'), pr=document.getElementById('pv-pr'), dl=document.getElementById('pv-dl'), dlf=document.getElementById('pv-dlf'), dlb=document.getElementById('pv-dlb'), fill=document.getElementById('pv-fill');
  var bar=document.getElementById('pv-bar'); function barH(){ document.body.style.setProperty('--bar-h', bar.offsetHeight+'px'); } barH(); window.addEventListener('resize',barH);
  function err(m){ msg.className='pv-msg err'; msg.textContent=m; msg.hidden=false; }
  if(!/^aadhaar\/[\w.-]+\.pdf$/.test(f)){ err('Yeh PDF nahi mili. Aadhaar Docs page par wapas jaakar dobara kholiye.'); pr.disabled=true; dlb.disabled=true; dl.removeAttribute('href'); return; }
  var name=(t||f.split('/').pop()).replace(/[^\w\u0900-\u097F() .-]+/g,' ').replace(/\s+/g,' ').trim().slice(0,90)||'aadhaar';
  document.getElementById('pv-title').textContent=t||name; document.title=(t||name)+' | PDF';
  var file=name.replace(/\s+/g,'_');
  dl.href=f; dl.setAttribute('download', file+'.pdf');
  var J='lib/pdfjs-6.2.108/', W=900, PAGES=[];
  var W0=900; function setW(w){ W=Math.max(280,Math.min(2000,w)); box.style.setProperty('--pw',W+'px'); var zv=document.getElementById('pv-zv'); if(zv) zv.textContent=Math.round(W/W0*100)+'%'; }
  W0=Math.min(900, (box.clientWidth||innerWidth)-20); setW(W0);
  document.getElementById('pv-zi').onclick=function(){ setW(W+150); };
  document.getElementById('pv-zo').onclick=function(){ setW(W-150); };
  // Download / Print: form bhara ho to chhota menu (bhara hua / khali), warna seedha
  function closeMenus(){ [].forEach.call(document.querySelectorAll('.pv-dd.open'),function(m){ m.classList.remove('open'); }); }
  document.addEventListener('click',function(e){ if(!e.target.closest('.pv-dd')) closeMenus(); });
  function doPrint(blank){ closeMenus(); document.activeElement&&document.activeElement.blur(); if(blank) document.body.classList.add('blankprint'); window.print(); setTimeout(function(){ document.body.classList.remove('blankprint'); },500); }
  window.addEventListener('afterprint',function(){ document.body.classList.remove('blankprint'); });
  pr.onclick=function(){ if(any()){ var o=!document.getElementById('pv-dd-pr').classList.contains('open'); closeMenus(); document.getElementById('pv-dd-pr').classList.toggle('open',o); } else doPrint(false); };
  dlb.onclick=function(){ if(any()){ var o=!document.getElementById('pv-dd-dl').classList.contains('open'); closeMenus(); document.getElementById('pv-dd-dl').classList.toggle('open',o); } else dl.click(); };
  document.getElementById('pv-prf').onclick=function(){ doPrint(false); };
  document.getElementById('pv-prb').onclick=function(){ doPrint(true); };
  dl.addEventListener('click',function(){ closeMenus(); });

  // ---------- Form bharna: neeli syahi jaisa likhna ----------
  var mode='text', ink='#1238a8', FS=1.9, last=null;
  function any(){ return [].some.call(box.querySelectorAll('.pv-w [data-t]'),function(e){ return e.textContent.trim(); }); }
  function refresh(){ document.body.classList.toggle('has', any()); }
  function setMode(m){ mode=m; document.body.classList.toggle('tick',m==='tick'); document.getElementById('pv-mtext').classList.toggle('on',m==='text'); document.getElementById('pv-mtick').classList.toggle('on',m==='tick');
    document.getElementById('pv-tip').textContent=m==='tick'?'Jis khaane me tick lagana hai wahan click kijiye':'Form par jahan likhna hai wahan click karke type kijiye'; }
  fill.onclick=function(){ var on=!document.body.classList.contains('filling'); document.body.classList.toggle('filling',on); fill.classList.toggle('on',on); barH(); };
  document.getElementById('pv-done').onclick=function(){ document.activeElement&&document.activeElement.blur(); document.body.classList.remove('filling'); fill.classList.remove('on'); refresh(); };
  document.getElementById('pv-mtext').onclick=function(){ setMode('text'); };
  document.getElementById('pv-mtick').onclick=function(){ setMode('tick'); };
  function inkSet(c,el){ ink=c; [].forEach.call(document.querySelectorAll('.pv-ink'),function(b){ b.classList.toggle('on',b===el); }); if(last) last.style.setProperty('--c',c); }
  document.getElementById('pv-blue').onclick=function(){ inkSet('#1238a8',this); };
  document.getElementById('pv-black').onclick=function(){ inkSet('#111111',this); };
  function size(dv){ if(last){ var v=Math.max(.9,Math.min(5,(+last.dataset.fs||FS)+dv)); last.dataset.fs=v; last.style.setProperty('--fs',v); FS=v; last.querySelector('[data-t]').focus(); } else FS=Math.max(.9,Math.min(5,FS+dv)); }
  document.getElementById('pv-fsm').onclick=function(){ size(-.25); };
  document.getElementById('pv-fsp').onclick=function(){ size(.25); };
  document.getElementById('pv-clear').onclick=function(){ if(confirmClear()) { [].forEach.call(box.querySelectorAll('.pv-w'),function(w){ w.remove(); }); last=null; refresh(); } };
  function confirmClear(){ var b=document.getElementById('pv-clear'); if(b.dataset.sure){ delete b.dataset.sure; b.textContent='Sab mitayein'; return true; } b.dataset.sure=1; b.textContent='Pakka? Dobara dabaiye'; setTimeout(function(){ delete b.dataset.sure; b.textContent='Sab mitayein'; },3000); return false; }
  function addBox(lay,x,y,txt,isTick){
    var w=document.createElement('div'); w.className='pv-w'; var fs=isTick?Math.max(FS,2.2):FS; w.dataset.fs=fs; w.style.setProperty('--fs',fs); w.style.setProperty('--c',ink);
    var px=lay.clientWidth, h=lay.clientHeight, fpx=fs/100*px;
    w.style.left=Math.max(0,(x-fpx*.12)/px*100)+'%'; w.style.top=Math.max(0,(y-fpx*.62)/h*100)+'%';
    w.innerHTML='<span class="mv" title="Khiskayein">⤧</span><span data-t contenteditable="plaintext-only" spellcheck="false"></span><span class="x" title="Hatayein">×</span>';
    var tx=w.querySelector('[data-t]'); if(tx.contentEditable!=='plaintext-only') tx.contentEditable='true';
    if(txt) tx.textContent=txt;
    lay.appendChild(w); last=w;
    w.querySelector('.x').onclick=function(e){ e.stopPropagation(); w.remove(); if(last===w) last=null; refresh(); };
    tx.addEventListener('focus',function(){ last=w; });
    tx.addEventListener('input',refresh);
    tx.addEventListener('blur',function(){ if(!tx.textContent.trim()) { w.remove(); if(last===w) last=null; } refresh(); });
    tx.addEventListener('keydown',function(e){ if(e.key==='Escape') tx.blur(); });
    // Khiskana (✥ pakad kar)
    w.querySelector('.mv').addEventListener('pointerdown',function(e){ e.preventDefault(); e.stopPropagation(); var r=lay.getBoundingClientRect(), sx=e.clientX, sy=e.clientY, l0=parseFloat(w.style.left), t0=parseFloat(w.style.top);
      function mv(ev){ w.style.left=Math.max(0,Math.min(98,l0+(ev.clientX-sx)/r.width*100))+'%'; w.style.top=Math.max(0,Math.min(98,t0+(ev.clientY-sy)/r.height*100))+'%'; }
      function up(){ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); }
      window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); });
    if(!isTick) tx.focus();
    refresh(); return w;
  }
  box.addEventListener('pointerdown',function(e){
    if(!document.body.classList.contains('filling')) return;
    var lay=e.target.closest('.pv-lay'); if(!lay||e.target.closest('.pv-w')) return;
    e.preventDefault(); var r=lay.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    if(mode==='tick') addBox(lay,x,y,'✓',true); else addBox(lay,x,y,'',false);
  });

  // ---------- Bhara hua PDF banana (har page ki photo + likha hua, bina kisi library) ----------
  async function filledPdf(){
    closeMenus(); dlb.disabled=true; var old=dlb.innerHTML; dlb.textContent='Ban raha hai…';
    try{
      var imgs=[];
      for(var i=0;i<PAGES.length;i++){
        var pg=PAGES[i], src=pg.canvas, c=document.createElement('canvas'); c.width=src.width; c.height=src.height; var x=c.getContext('2d');
        x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(src,0,0);
        var lay=pg.lay, LW=lay.clientWidth||1, LH=lay.clientHeight||1, sx=c.width/LW, sy=c.height/LH;
        [].forEach.call(lay.querySelectorAll('.pv-w'),function(w){
          var tx=w.querySelector('[data-t]'), txt=tx.textContent; if(!txt.trim()) return;
          var cs=getComputedStyle(tx), fpx=parseFloat(cs.fontSize)*sx, tr=tx.getBoundingClientRect(), lr=lay.getBoundingClientRect();
          x.fillStyle=cs.color; x.font=cs.fontWeight+' '+fpx+'px '+cs.fontFamily; x.textBaseline='top';
          var lh=fpx*1.15; txt.split('\n').forEach(function(line,k){ x.fillText(line,(tr.left-lr.left)*sx,(tr.top-lr.top)*sy+k*lh+fpx*.05); });
        });
        var b64=c.toDataURL('image/jpeg',.9).split(',')[1], bin=atob(b64), u=new Uint8Array(bin.length); for(var k=0;k<bin.length;k++) u[k]=bin.charCodeAt(k);
        imgs.push({jpg:u, w:c.width, h:c.height, pw:pg.pw, ph:pg.ph});
      }
      var blob=makePdf(imgs), a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=file+'_bhara.pdf'; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },4000);
    }catch(e){ alertMsg('Bhara hua PDF nahi ban paya. Print → "Save as PDF" se save kijiye.'); }
    dlb.disabled=false; dlb.innerHTML=old;
  }
  function alertMsg(m){ msg.className='pv-msg err'; msg.textContent=m; msg.hidden=false; setTimeout(function(){ msg.hidden=true; },6000); }
  function makePdf(imgs){
    var enc=new TextEncoder(), parts=[], off=0, xref=[];
    function put(x){ var b=typeof x==='string'?enc.encode(x):x; parts.push(b); off+=b.length; }
    put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    var n=imgs.length, kids=[]; for(var i=0;i<n;i++) kids.push((3+i*3)+' 0 R');
    xref[1]=off; put('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    xref[2]=off; put('2 0 obj\n<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>\nendobj\n');
    imgs.forEach(function(im,i){
      var pid=3+i*3, iid=pid+1, cid=pid+2, pw=im.pw.toFixed(2), ph=im.ph.toFixed(2), cs='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
      xref[pid]=off; put(pid+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>\nendobj\n');

      xref[cid]=off; put(cid+' 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
    });
    var total=3+n*3, xo=off, xs='xref\n0 '+total+'\n0000000000 65535 f \n';

  }
